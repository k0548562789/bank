/* Layout: one centered card, sticker on top, four copy rows, one wide "copy all" button */
:root{
  --bg:#000000; --card:#121014; --fg:#f6f2f8; --muted:#a59cad; --line:#2a2430;
  --purple:#9a8cf5; --pink:#f26b85; --yellow:#fde0bb; --violet:#9c44a3; --coral:#f48792;
  --ok:#4cc985; color-scheme:dark;
  --ring:linear-gradient(90deg,#fde0bb,#f9bdab,#f48792,#f26b85,#d7427f,#bb4390,#9c44a3,#6f46be,#5847cc);
  --btn:linear-gradient(90deg,#f48792,#f26b85,#d7427f,#bb4390,#9c44a3,#6f46be,#5847cc);
  --display:"SimplerEmbed","Assistant",system-ui,Arial,sans-serif;
  --body:"SimplerEmbed","Assistant",system-ui,"Segoe UI",Arial,sans-serif;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:40px 48px}
html,body{min-height:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.sticker{width:150px;height:auto;margin:0 auto;display:block;border-radius:12px;background:#fff;padding:6px}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.15;text-align:center;margin:0;text-wrap:balance}
.sub{color:var(--muted);text-align:center;margin:-8px 0 0;font-size:.95rem;line-height:1.45}
.card{background:var(--card);border-radius:18px;padding:3px;background-image:linear-gradient(var(--card),var(--card)),var(--ring);
  background-origin:border-box;background-clip:padding-box,border-box;border:3px solid transparent}
.rows{list-style:none;margin:0;padding:6px 0}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.txt{flex:1;min-width:0}
.lbl{font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.val{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;text-align:right;user-select:all}
.val.he{direction:rtl}
.copy{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--purple);
  display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.copy:hover{background:color-mix(in srgb,var(--coral) 14%,transparent);border-color:var(--pink);color:var(--pink)}
.copy:focus-visible,.all:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.copy svg{width:20px;height:20px}
.copy .ic-ok{display:none}
.copy.done{color:var(--ok);border-color:var(--ok)}
.copy.done .ic-copy{display:none}.copy.done .ic-ok{display:block}
.all{font-family:var(--body);font-weight:700;font-size:1.1rem;color:#fff;border:0;border-radius:14px;padding:16px;cursor:pointer;
  background:var(--btn);display:flex;gap:10px;justify-content:center;align-items:center}
.all svg{width:20px;height:20px}
.toast{text-align:center;min-height:1.4em;color:var(--ok);font-weight:500;margin:-8px 0 0}
.note{color:var(--fg);font-weight:700;font-size:1.05rem;text-align:center;margin:0}
.logo{display:flex;justify-content:center}.logo img{width:110px;max-width:40%;height:auto}
.logo-l{display:none}
.txt{display:flex;flex-direction:column;gap:6px}
.lbl{line-height:1.3}
.val{line-height:1.3}
@media (prefers-reduced-motion:reduce){.copy{transition:none}}

<script>
const ALL = "בנק: 17\nסניף: 725\nמספר חשבון: 071637\nבעל החשבון: ליבא קוזליק";
const toast = document.getElementById('toast');
let tTimer;
function say(msg){ toast.textContent = msg; clearTimeout(tTimer); tTimer = setTimeout(()=>toast.textContent='', 2500); }
function fallback(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
  ta.remove(); return ok;
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){ return fallback(text); }
}
document.querySelectorAll('.copy').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    const ok = await copy(btn.dataset.copy);
    if(ok){ btn.classList.add('done'); setTimeout(()=>btn.classList.remove('done'),1800); say(btn.dataset.name + ' הועתק'); }
    else say('לא הצלחנו להעתיק. אפשר לסמן את הטקסט ולהעתיק ידנית');
  });
});
